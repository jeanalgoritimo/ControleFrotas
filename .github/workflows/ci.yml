name: Build e verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Fleet-CI-Only-123456!"
        ports:
          - 1433:1433
    env:
      FLEET_TEST_SQL: "Server=localhost,1433;User ID=sa;Password=Fleet-CI-Only-123456!;Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build backend/ControleFrotas.slnx --configuration Release
      - run: dotnet run --project tests/ControleFrotas.Checks.csproj --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
